<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuario</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
</head>
<body>
  <form class="box">

    <div class="field">
      <label class="label">Nombre</label>
      <div class="control">
        <input class="input" id="nombre" type="text" placeholder="Ingrese su nombre" />
      </div>
    </div>

    <div class="field">
      <label class="label">Apellido</label>
      <div class="control">
        <input class="input" id="apellido" type="text" placeholder="Ingrese su apellido" />
      </div>
    </div>

    <div class="field">
      <label class="label">Tipo de documento</label>
      <div class="control">
        <input class="input" id="tipodocumento" type="text" placeholder="Ingrese su tipo de documento" />
      </div>
    </div>

    <div class="field">
      <label class="label">Número de documento</label>
      <div class="control">
        <input class="input" id="numerodocumento" type="text" placeholder="Ingrese su número de documento" />
      </div>
    </div>

    <div class="field">
      <label class="label">Teléfono</label>
      <div class="control">
        <input class="input" id="telefono" type="tel" placeholder="Ingrese su teléfono" />
      </div>
    </div>

    <div class="field">
      <label class="label">Correo Electrónico</label>
      <div class="control">
        <input class="input" id="correoelectronico" type="email" placeholder="ejemplo@correo.com" />
      </div>
    </div>

    <div class="field">
      <label class="label">Género</label>
      <div class="control">
        <input class="input" id="genero" type="text" placeholder="Ingrese su género"/>
      </div>
    </div>

    <div class="field">
      <label class="label">Cargo</label>
      <div class="control">
        <input class="input" id="cargo" type="text" placeholder="Ingrese su cargo" />
      </div>
    </div>

    <div class="field">
      <label class="label">Fecha de nacimiento</label>
      <div class="control">
        <input class="input" id="fechanacimiento" type="text" placeholder="YYYY-MM-DD" />
      </div>
    </div>

    <div class="field">
      <label class="label">Contraseña</label>
      <div class="control">
        <input class="input" id="contrasena" type="password" placeholder="********" />
      </div>
    </div>

    <div class="field">
      <div class="control">
        <!-- BOTÓN CORREGIDO CON ONCLICK Y TYPE="BUTTON" -->
        <button class="button is-primary is-fullwidth" type="button" id="btnGuardar">
          Registrarse
        </button>
        
        <br>
        <div class="has-text-centered my-5">
          <a href="../inicio.html" class="button is-link is-rounded">
            <span>Volver al inicio</span>
          </a>
        </div>
      </div>
    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/usuario.js"></script>
</body>
</html>
