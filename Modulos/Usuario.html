<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuario</title>
  <link rel="stylesheet" href="/css/Ususarios.css">
</head>
<body>
  <form class="box">

  <div class="field">
    <label class="label">Nombre</label>
    <div class="control">
      <input class="input" type="text" placeholder="Ingrese su nombre" />
    </div>
  </div>


  <div class="field">
    <label class="label">Apellido</label>
    <div class="control">
      <input class="input" type="text" placeholder="Ingrese su apellido" />
    </div>
  </div>


  <div class="field">
    <label class="label">Tipo de documento</label>
    <div class="control">
      <input class="input" type="text" placeholder="Ingrese su tipo de documento" />
    </div>
  </div>


  <div class="field">
    <label class="label">Número de documento</label>
    <div class="control">
      <input class="input" type="text" placeholder="Ingrese su número de documento" />
    </div>
  </div>


  <div class="field">
    <label class="label">Teléfono</label>
    <div class="control">
      <input class="input" type="tel" placeholder="Ingrese su teléfono" />
    </div>
  </div>

  <div class="field">
    <label class="label">Correo Electronico</label>
    <div class="control">
      <input class="input" type="email" placeholder="ejemplo@correo.com" />
    </div>
  </div>


  <div class="field">
    <label class="label">Género</label>
    <div class="control">
      <input class="input" type="text" placeholder="Ingrese su genero"/>
    </div>
  </div>

 
  <div class="field">
    <label class="label">Cargo</label>
    <div class="control">
      <input class="input" type="text" placeholder="Ingrese su cargo" />
    </div>
  </div>


  <div class="field">
    <label class="label">Fecha de nacimiento</label>
    <div class="control">
      <input class="input" type="text" placeholder="Ingrese su fecha de nacimiento" />
    </div>
  </div>

  
  <div class="field">
    <label class="label">Contraseña</label>
    <div class="control">
      <input class="input" type="password" placeholder="********" />
    </div>
  </div>

 
  <div class="field">
    <div class="control">
      <button class="button is-primary is-fullwidth">
        Registrarse
      </button>
<br>
      <div class="has-text-centered my-5">
  <a href="/inicio.html" class="button is-link is-rounded">
    <span>Volver al inicio</span>
  </a>
</div>
    </div>
  </div>
</form>
</body>
</html>
