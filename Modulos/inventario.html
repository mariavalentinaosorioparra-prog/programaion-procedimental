<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
</head>
<body>


  <form class="box">

 <div class="field">
    <label class="label">Codigo Producto</label>
    <div class="control">
      <input class="input" id="codigoproducto" type="text" placeholder="Ingrese el código del producto" />
    </div>
  </div>

  <div class="field">
    <label class="label">Nombre Producto</label>
    <div class="control">
      <input class="input" id="nombreproducto" type="text" placeholder="Ingrese el nombre del producto" />
    </div>
  </div>

  <div class="field">
    <label class="label">Cantidad Producto</label>
    <div class="control">
      <input class="input" id="cantidadproducto"   type="text" placeholder="Ingrese la cantidad del producto" />
    </div>
  </div>


  <div class="field">
    <label class="label">Descripción producto</label>
    <div class="control">
      <input class="input" id="descripcionproducto" type="text" placeholder="Ingrese la descripción del producto" />
    </div>
  </div>

  <div class="field">
    <label class="label">Marca Producto</label>
    <div class="control">
      <input class="input" id="marcaproducto" type="text" placeholder="Ingrese la marca del producto" />
    </div>
  </div>

  <div class="field">
    <label class="label">Categoria Producto</label>
    <div class="control">
      <input class="input" id="categoriaproducto" type="text" placeholder="Ingrese la categoría del producto" />
    </div>
  </div>

  <div class="field">
    <label class="label">Ubicacion Producto</label>
    <div class="control">
      <input class="input" id="ubicacionproducto" type="text" placeholder="Ingrese la ubicación del producto" />
    </div>
  </div>

  <div class="field">
    <div class="control">
      <button class="button is-primary is-fullwidth" type="button" onclick="validarDatos()">
        Registrar
      </button>
 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="../js/inventario.js"></script>

      <br>
      <div class="has-text-centered my-5">
  <a href="/inicio.html" class="button is-link is-rounded">
    <span>Volver al inicio</span>
  </a>
    </div>
  </div>
</form>
</body>
</html>
